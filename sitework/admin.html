<!doctype html>
<html lang="bn"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#064b3c"><title>অ্যাডমিন প্যানেল | আংড়া মেছবাহুল উলুম নুরানী একাডেমী</title><link rel="stylesheet" href="style.css"><style>
:root{--adm-green:#08775b;--adm-deep:#034b3b;--adm-line:#d6eee5;--adm-gold:#e8b94f}
body.admin-page{min-height:100vh;background:radial-gradient(circle at 50% 12%,#f5fffb 0,#e8f8f1 48%,#fff 100%);color:#124d3e;overflow-x:hidden;position:relative}
body.admin-page:before{content:"";position:absolute;inset:0 0 auto;height:330px;pointer-events:none;background:linear-gradient(145deg,#eafff5 0%,#fafffd 60%,#d7f3e8 100%);z-index:0}
.adminwrap{position:relative;z-index:1;max-width:720px;width:calc(100% - 28px);margin:0 auto;padding:26px 0 54px}
.back{display:inline-flex;align-items:center;gap:7px;margin:0 0 18px;color:var(--adm-green);font-weight:800;font-size:14px}
.academy-brand{text-align:center;padding:10px 8px 26px}
.academy-brand img{width:88px;height:88px;object-fit:contain;filter:drop-shadow(0 7px 9px #075e5420)}
.academy-brand h1{font-size:clamp(20px,5vw,31px);line-height:1.45;color:var(--adm-deep);margin:8px 0 2px;font-weight:900}
.academy-brand p{margin:0;color:#347c68;font-weight:700;font-size:14px}
.login-shell{background:#ffffffed;border:1px solid #fff;border-radius:26px;padding:15px;box-shadow:0 20px 55px #075e541b}
.admhead{position:relative;overflow:hidden;background:linear-gradient(120deg,#034b3b,#007b5b 70%,#08a77b);color:#fff;border-radius:20px;padding:23px 22px;display:flex;align-items:center;gap:18px;box-shadow:0 10px 25px #075e5420}
.admhead:after{content:"";position:absolute;right:-40px;bottom:-72px;width:220px;height:150px;border:2px solid #d6fff24d;border-radius:50%;transform:rotate(-18deg);box-shadow:0 0 0 14px #d6fff215,0 0 0 30px #d6fff20c}
.shield{flex:0 0 66px;width:66px;height:66px;border-radius:50%;display:grid;place-items:center;background:linear-gradient(145deg,#21c58b,#00634a);border:1px solid #9ef2ce66;font-size:34px;box-shadow:inset 0 0 0 5px #ffffff15}
.admhead .headcopy{position:relative;z-index:1;border-left:2px solid #ffffff85;padding-left:17px;min-width:0}
.admhead h2{font-size:clamp(23px,5vw,31px);line-height:1.35;margin:0;font-weight:900;color:white}
.admhead p{font-size:13px;line-height:1.6;margin:4px 0 0;color:#d8f5e9}
.panel{border:0;border-radius:19px;padding:25px 20px;margin:0;background:#fff}
.panel h2{margin:0;color:var(--adm-deep);font-size:clamp(22px,5vw,29px);font-weight:900;line-height:1.4}
.login-intro{margin:7px 0 27px;color:#638075;font-weight:600;font-size:14px}
.panel label{display:grid;gap:9px;font-weight:800;font-size:15px;margin:18px 0 22px;color:#075d48}
.password-wrap{position:relative;display:flex;align-items:center}
.panel input{font:inherit;border:1.5px solid #cfe4dc;border-radius:14px;padding:15px 52px 15px 16px;width:100%;min-width:0;background:#fff;outline:none;box-shadow:inset 0 1px 3px #064b3c08;transition:border-color .2s,box-shadow .2s}
.panel input:focus{border-color:#0a9b72;box-shadow:0 0 0 4px #0a9b7219}
.panel input::placeholder{color:#9aafa8}
.password-wrap .toggle-password{position:absolute;right:7px;top:50%;transform:translateY(-50%);width:42px;height:42px;display:grid;place-items:center;border:0;border-radius:10px;background:#effaf5;color:#08664e;padding:0;cursor:pointer;z-index:2;-webkit-tap-highlight-color:transparent}.toggle-password svg{display:block;width:23px;height:23px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}.toggle-password:focus-visible{outline:2px solid #0a9b72;outline-offset:2px}
.btn.primary.login-btn{width:100%;min-height:58px;border-radius:15px;background:linear-gradient(110deg,#07875f,#005743);font-size:18px;font-weight:900;color:#fff;box-shadow:0 12px 24px #08775b2b;display:flex;align-items:center;justify-content:center;gap:12px}
.login-btn:active{transform:scale(.99)}
.msg{min-height:24px;margin:17px 0 0;text-align:center;font-size:13px;font-weight:700;color:#9b3027;overflow-wrap:anywhere}
.hidden{display:none!important}.danger{background:#fff0f0;color:#8b1d1d;border:1px solid #f1caca;border-radius:8px;padding:9px 12px}
.dashboard .panel{border:1px solid var(--adm-line);border-radius:18px;margin-top:15px;box-shadow:0 8px 24px #075e5409}
.panel label input,.panel textarea{padding:11px 12px;border-radius:10px}
.panel textarea{min-height:100px}.savednotice{padding:12px;border:1px solid var(--adm-line);border-radius:10px;margin-top:10px}.savednotice button{margin-left:10px;color:#a32424;border:0;background:#fff0f0;border-radius:7px;padding:6px}
.ornament{display:flex;align-items:center;gap:12px;justify-content:center;margin:25px 8px 3px;color:#0a765b;font-size:18px}.ornament:before,.ornament:after{content:"";height:1px;flex:1;background:linear-gradient(90deg,transparent,#8ccfba)}.ornament:after{background:linear-gradient(90deg,#8ccfba,transparent)}
@media(max-width:480px){.adminwrap{width:calc(100% - 22px);padding-top:20px}.academy-brand{padding:4px 4px 22px}.academy-brand img{width:72px;height:72px}.login-shell{padding:9px;border-radius:22px}.admhead{padding:19px 15px;gap:13px;border-radius:17px}.shield{width:54px;height:54px;flex-basis:54px;font-size:28px}.admhead .headcopy{padding-left:12px}.admhead p{font-size:11px}.panel{padding:24px 14px}.login-intro{font-size:13px;margin-bottom:24px}.panel label{font-size:14px}.btn.primary.login-btn{min-height:55px;font-size:16px}}
</style></head><body class="admin-page"><main class="adminwrap"><a class="back" href="index.html">← মূল ওয়েবসাইটে ফিরুন</a>
<header class="academy-brand"><img src="academy-logo.png" alt="একাডেমির লোগো"><h1>আংড়া মেহবাহুল উলুম নূরানী একাডেমী</h1><p>জ্ঞান · নৈতিকতা · আদর্শ</p></header>
<div class="login-shell"><header class="admhead"><div class="shield" aria-hidden="true">♙</div><div class="headcopy"><h2>অ্যাডমিন প্যানেল</h2><p>আংড়া মেহবাহুল উলুম নূরানী একাডেমী</p></div></header>
<section id="loginPanel" class="panel"><h2>নিরাপদ অ্যাডমিন লগইন</h2><p class="login-intro">শুধু পাসওয়ার্ড দিয়েই প্রবেশ করতে পারবেন।</p><form id="loginForm"><label for="password">🔒 &nbsp; পাসওয়ার্ড<div class="password-wrap"><input id="password" type="password" autocomplete="current-password" required minlength="1" maxlength="200" placeholder="পাসওয়ার্ড লিখুন"><button id="togglePassword" class="toggle-password" type="button" aria-label="পাসওয়ার্ড দেখান" aria-pressed="false"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12Z"></path><circle cx="12" cy="12" r="3"></circle></svg></button></div></label><button class="btn primary login-btn" type="submit"><span aria-hidden="true">🔒</span> লগইন করুন <span aria-hidden="true">→</span></button><p id="loginMsg" class="msg" role="status"></p><div class="ornament" aria-hidden="true">۞</div></form></section></div>
<section id="dashboard" class="hidden dashboard"><section class="panel"><div style="display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap"><h2>নতুন নোটিশ প্রকাশ</h2><button id="logoutBtn" class="danger" type="button">লগআউট</button></div><form id="noticeForm"><label>নোটিশের শিরোনাম<input id="title" required maxlength="120" placeholder="যেমন: পরীক্ষার রুটিন প্রকাশ"></label><label>তারিখ/ধরন<input id="date" maxlength="50" placeholder="যেমন: জরুরি নোটিশ"></label><label>বিস্তারিত<textarea id="body" required maxlength="1500" placeholder="নোটিশের বিস্তারিত লিখুন"></textarea></label><button class="btn primary" type="submit">নোটিশ প্রকাশ করুন</button><p id="noticeMsg" class="msg" role="status"></p></form></section><section class="panel"><h2>প্রকাশিত নোটিশ</h2><div id="saved"></div></section></section>
</main>
<script>
const $=id=>document.getElementById(id);const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
async function api(url,options={}){const r=await fetch(url,{...options,headers:{'Content-Type':'application/json',...(options.headers||{})}});let data={};try{data=await r.json()}catch{}if(!r.ok)throw new Error(data.error||'অনুরোধ সম্পন্ন হয়নি।');return data}
function message(id,text){$(id).textContent=text}
function setLoggedIn(yes){$('loginPanel').classList.toggle('hidden',yes);$('dashboard').classList.toggle('hidden',!yes)}
async function loadNotices(){const items=await api('/api/notices');$('saved').innerHTML=items.length?items.map(n=>`<div class="savednotice"><b>${esc(n.title)}</b><div>${esc(n.date||'')}</div><p>${esc(n.body)}</p><button class="danger" type="button" data-del="${Number(n.id)}">মুছুন</button></div>`).join(''):'এখনো কোনো নোটিশ প্রকাশ করা হয়নি।'}
$('togglePassword').addEventListener('click',()=>{const p=$('password');const btn=$('togglePassword');const show=p.type==='password';p.type=show?'text':'password';btn.innerHTML=show?'<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 3l18 18"></path><path d="M10.6 10.6a2 2 0 0 0 2.8 2.8"></path><path d="M9.9 5.2A10.8 10.8 0 0 1 12 5c6.4 0 10 7 10 7a17 17 0 0 1-3.1 3.8"></path><path d="M6.2 6.2C3.5 8 2 12 2 12s3.6 7 10 7a10.4 10.4 0 0 0 4-.8"></path></svg>':'<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12Z"></path><circle cx="12" cy="12" r="3"></circle></svg>';btn.setAttribute('aria-label',show?'পাসওয়ার্ড লুকান':'পাসওয়ার্ড দেখান');btn.setAttribute('aria-pressed',String(show))});
$('loginForm').addEventListener('submit',async e=>{e.preventDefault();message('loginMsg','লগইন যাচাই হচ্ছে…');try{await api('/api/login',{method:'POST',body:JSON.stringify({password:$('password').value})});$('password').value='';setLoggedIn(true);message('loginMsg','');await loadNotices()}catch(err){message('loginMsg',err.message)}});
$('noticeForm').addEventListener('submit',async e=>{e.preventDefault();message('noticeMsg','নোটিশ প্রকাশ হচ্ছে…');try{await api('/api/notices',{method:'POST',body:JSON.stringify({title:$('title').value.trim(),date:$('date').value.trim(),body:$('body').value.trim()})});e.target.reset();message('noticeMsg','নোটিশ প্রকাশ হয়েছে। এখন সবার ওয়েবসাইটে দেখা যাবে।');await loadNotices()}catch(err){message('noticeMsg',err.message)}});
$('saved').addEventListener('click',async e=>{const id=e.target.dataset.del;if(!id)return;if(!confirm('এই নোটিশটি মুছে ফেলবেন?'))return;try{await api('/api/notices/'+id,{method:'DELETE'});await loadNotices()}catch(err){alert(err.message)}});
$('logoutBtn').addEventListener('click',async()=>{try{await api('/api/logout',{method:'POST',body:'{}'})}finally{setLoggedIn(false);message('loginMsg','আপনি লগআউট হয়েছেন।')}});
(async()=>{try{await api('/api/session');setLoggedIn(true);await loadNotices()}catch{setLoggedIn(false)}})();
</script></body></html>
