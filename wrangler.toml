name = "academy"
main = "src/index.js"
compatibility_date = "2025-03-01"
workers_dev = true

[assets]
directory = "./sitework"
binding = "ASSETS"
run_worker_first = ["/api/*"]

[[d1_databases]]
binding = "DB"
database_name = "angra-academy-db"
database_id = "REPLACE_WITH_YOUR_D1_DATABASE_ID"
migrations_dir = "migrations"
